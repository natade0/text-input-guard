<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<title>TextInputGuard</title>
		<link rel="stylesheet" href="./css/demo.css" />
	</head>
	<body>
		<label>
			<input id="price" type="text" inputmode="number" style="text-align: right" />
		</label>

		<div id="output" class="kv"></div>

		<script
			src="https://code.jquery.com/jquery-4.0.0.slim.min.js"
			integrity="sha256-8DGpv13HIm+5iDNWw1XqxgFB4mj+yOKFNb+tHBZOowc="
			crossorigin="anonymous"
		></script>
		<script type="module">
			import { bindGuardDebug } from "./js/guard-debug.js";
			import { attachAll, rules } from "./lib/text-input-guard.min.js";

			const input = $("#price");
			const output = document.getElementById("output");

			const guards = attachAll(input, {
				rules: [
					rules.numeric({
						allowFullWidth: true,
						allowMinus: true,
						allowDecimal: false,
						allowEmpty: true
					}),
					rules.digits({
						int: 10
					}),
					rules.comma()
				],
				onChange: (guard) => {
					console.log(`rawValue: ${guard.getRawValue()}`);
					console.log(`displayValue: ${guard.getDisplayValue()}`);
				}
			});

			const guard = guards.getGuards()[0];
			console.log(`rawElement: ${guard.getRawElement()}`);
			console.log(`displayElement: ${guard.getDisplayElement()}`);

			bindGuardDebug(guards.getGuards()[0], output);
		</script>
	</body>
</html>
